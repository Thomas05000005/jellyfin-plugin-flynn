<!-- Admin shell. Deliberately almost empty: every label below is fetched from the server so that
     adding a module, or a language, never means editing this file.

     The script and stylesheet are referenced by URL rather than inlined because a browser sends no
     authorization header for these tags. They carry no data; every call they make afterwards hits
     an endpoint that checks for elevation. -->
<div id="FlynnConfigPage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content">
    <div class="content-primary">

      <link rel="stylesheet" href="/Flynn/admin.css" />

      <div class="flynn-header">
        <h2 class="flynn-title">Flynn</h2>
        <span class="flynn-tagline">He fights for the Users.</span>
      </div>

      <div class="flynn-section">
        <h3 class="flynn-section-title" data-flynn-label="ui.modules">Modules</h3>
        <div id="flynnModuleCards" class="flynn-grid"></div>
      </div>

      <div class="flynn-section">
        <h3 class="flynn-section-title" data-flynn-label="ui.attention">Needs your attention</h3>
        <div id="flynnIssues"></div>
      </div>

      <script src="/Flynn/admin.js" defer></script>
    </div>
  </div>
</div>
