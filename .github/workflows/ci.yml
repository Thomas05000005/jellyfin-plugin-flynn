name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 1
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # TreatWarningsAsErrors is on in the csproj, so a warning fails here on its own.
      - name: Build
        run: dotnet build -c Release

      - name: Test
        run: dotnet test -c Release --no-build --logger "console;verbosity=normal"

  package:
    name: Package and check the assemblies whitelist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release

      - name: Stage exactly what would be zipped
        run: |
          mkdir -p staging
          cp src/Jellyfin.Plugin.Flynn/bin/Release/net10.0/Jellyfin.Plugin.Flynn.dll staging/

      - name: Generate meta.json
        run: python3 build/make_meta.py --staging staging

      # The whitelist is fail-closed and all-or-nothing: a listed file that is not present marks
      # the whole plugin Malfunctioned. So assert the two sets agree before anything ships.
      - name: The whitelist must match the staged managed assemblies exactly
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "build")
          from make_meta import is_managed_assembly

          staging = Path("staging")
          listed = set(json.loads((staging / "meta.json").read_text())["assemblies"])
          on_disk = {
              p.relative_to(staging).as_posix()
              for p in staging.rglob("*.dll")
              if is_managed_assembly(p)
          }

          if listed != on_disk:
              print(f"listed but absent:   {sorted(listed - on_disk)}")
              print(f"present but unlisted:{sorted(on_disk - listed)}")
              raise SystemExit("meta.json assemblies do not match the staged managed assemblies")
          if not listed:
              raise SystemExit("empty whitelist: the server would load every dll recursively")
          print(f"whitelist agrees with {len(listed)} staged managed assembly/assemblies")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: plugin-staging
          path: staging/

  smoke:
    name: Load on a real Jellyfin ${{ matrix.jellyfin }} server
    runs-on: ubuntu-latest
    needs: package
    strategy:
      fail-fast: false
      matrix:
        jellyfin: ['12.0-rc3', '12.0-rc4']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin-staging
          path: staging

      - name: Install the plugin into a config volume
        run: |
          mkdir -p jf-config/plugins/Flynn
          cp staging/* jf-config/plugins/Flynn/
          ls -la jf-config/plugins/Flynn/

      - name: Start Jellyfin ${{ matrix.jellyfin }}
        run: |
          docker run -d --name jf -p 8096:8096 \
            -v "$PWD/jf-config:/config" \
            jellyfin/jellyfin:${{ matrix.jellyfin }}

      - name: Wait for the server to answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8096/System/Info/Public >/dev/null 2>&1; then
              echo "up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::server never became reachable"
          docker logs jf 2>&1 | tail -50
          exit 1

      - name: Assert the plugin loaded cleanly
        run: bash scripts/assert_plugin_loaded.sh jf

      - name: Server log on failure
        if: failure()
        run: docker logs jf 2>&1 | tail -200
